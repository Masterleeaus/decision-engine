name: Reference engine tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all reference engine tests
        run: node scripts/reference-tests.mjs
