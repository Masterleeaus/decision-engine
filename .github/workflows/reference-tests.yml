name: Reference engine tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install package dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run all reference engine suites
        run: npm test
