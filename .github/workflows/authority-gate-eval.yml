name: Authority gate evaluation

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  authority-gate-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authority gate evaluation
        run: node --experimental-strip-types scripts/authority-gate-eval.mjs
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-gate-evaluation
          path: eval-results/
