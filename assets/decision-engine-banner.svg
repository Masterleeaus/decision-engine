<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Titan Decision Engine</title>
  <desc id="desc">A dark navy decision trace showing evidence, constraints, ranking, recommendation, and a governed handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#153554"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55e0cf"/><stop offset="1" stop-color="#5da8ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#69d9d2"/></marker>
    <style>
      .title{font:700 42px Segoe UI,Arial,sans-serif;fill:#f4f8fc}.sub{font:600 15px Segoe UI,Arial,sans-serif;letter-spacing:2.7px;fill:#c9e5ed}.eyebrow{font:700 12px Segoe UI,Arial,sans-serif;letter-spacing:2.5px;fill:#6fe0d3}.label{font:700 12px Segoe UI,Arial,sans-serif;fill:#eef8fb}.tiny{font:400 11px Segoe UI,Arial,sans-serif;fill:#a8c1d2}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1100" cy="-10" r="230" fill="#2b6386" opacity=".18"/><circle cx="900" cy="390" r="190" fill="#0b9f9a" opacity=".12"/>
  <text x="70" y="66" class="eyebrow">TITAN � DECISION SUPPORT � STEPS 10-30</text>
  <text x="70" y="125" class="title">Titan Decision Engine</text>
  <text x="72" y="160" class="sub">EVIDENCE    CONSTRAINTS    RANKING    GOVERNED HANDOFF</text>
  <path d="M80 246H1110" stroke="#416783" stroke-width="2" opacity=".8"/>
  <path d="M126 246H1080" stroke="url(#trace)" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <circle cx="126" cy="246" r="24" fill="#12334b" stroke="#59d9ce" stroke-width="2"/><text x="126" y="251" text-anchor="middle" class="label">01</text><text x="126" y="292" text-anchor="middle" class="label">Evidence</text><text x="126" y="312" text-anchor="middle" class="tiny">sources + freshness</text>
    <circle cx="365" cy="246" r="24" fill="#12334b" stroke="#59d9ce" stroke-width="2"/><text x="365" y="251" text-anchor="middle" class="label">02</text><text x="365" y="292" text-anchor="middle" class="label">Eligibility</text><text x="365" y="312" text-anchor="middle" class="tiny">hard constraints first</text>
    <circle cx="604" cy="246" r="24" fill="#12334b" stroke="#68b7ff" stroke-width="2"/><text x="604" y="251" text-anchor="middle" class="label">03</text><text x="604" y="292" text-anchor="middle" class="label">Ranking</text><text x="604" y="312" text-anchor="middle" class="tiny">trade-offs + sensitivity</text>
    <circle cx="843" cy="246" r="24" fill="#12334b" stroke="#68b7ff" stroke-width="2"/><text x="843" y="251" text-anchor="middle" class="label">04</text><text x="843" y="292" text-anchor="middle" class="label">Recommendation</text><text x="843" y="312" text-anchor="middle" class="tiny">confidence or abstain</text>
    <circle cx="1082" cy="246" r="24" fill="#14384a" stroke="#f0bd72" stroke-width="2"/><text x="1082" y="251" text-anchor="middle" class="label">05</text><text x="1082" y="292" text-anchor="middle" class="label">Host handoff</text><text x="1082" y="312" text-anchor="middle" class="tiny">approval stays external</text>
  </g>
  <text x="70" y="342" class="tiny">DecisionPacket � transparent reasoning � authority remains outside the engine</text>
</svg>

